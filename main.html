<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cervantes MUN</title>
    <link rel="icon" href="./images/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Oswald:wght@200..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Oswald, sans-serif;

        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 8vh;
            background-color: #136D80;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-right: 30px;
        }

        .localcontent {
            padding: 5vh;
            background-color: rgb(201, 218, 218);
            height: 5vh;
            color: black;
            text-align: right;

            @media (orientation: portrait) {
                padding-right: 3vh;
            }
        }

        .page {
            background-color: #186574;
            height: auto;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10vh;
            height: 100vh;
            width: auto;
            background-color: #EBFFFF;
            text-align: center;
            background-image: url("./images/logohitr.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: 80vh auto;

            @media (orientation: landscape) {
                background-size: 90vh auto;
            }
        }

        .box {
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2), 0 6px 20px 0 rgba(0, 0, 0, 0.19);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80vh;
            height: auto;
            max-height: 500px;
            max-width: 450px;
            border-radius: 15px;
            background-color: rgb(255, 235, 216);
            text-align: center;
            border: 5px solid #ccb366;

            @media (orientation: portrait) {
                max-width: 350px;
                margin-top: 10vh;
                position: relative;
                top: -10vh;
            }

            @media (orientation: landscape) {
                margin-top: 10vh;
            }
        }

        .content p {
            font-size: 24px;
            margin: 0 0;
        }

        .content h1 {
            font-size: 70px;
            margin: 0px 0;
            font-weight: 800;
            font-family: "Jim Nightshade", cursive;
            margin-bottom: -25px;
            margin-top: -20px;

            @media(orientation:portrait) {
                font-size: 60px;
            }
        }

        .navbar img {
            height: 100px;
            margin-right: 25px;
            margin-top: 30px;
        }

        .navbar a {
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <img src="./images/logohi.png" alt="Logo">
        <a href="./main.html">Home</a>
        <a href="./about.html">About</a>
        <a href="./contact.html">Contact</a>
    </div>
    <div class="localcontent">
        <h1>Home</h1>
    </div>
    <div class="page">
        <div class="content">
            <br><br><br>
            <div class="box" style="margin-top:0">
                <p>Welcome to</p>
                <h1>Cervantes MUN</h1>
                <p>16-18 October 2026</p>
                <p style="font-size:20px">Save the Date</p>
            </div>
            <div class="box" style="height:8vh; display: flex; justify-content: center; align-items: center;">
                <a href="https://forms.gle/DJSHiHX9BsT8kpVr5"
                    style="font-size:30px; font-family: 'Oswald', sans-serif;">Register Now!</a>
            </div>
        </div>
    </div>

</body>

</html>
